name: 쇼츠 만들기

on:
  workflow_dispatch:
    inputs:
      episode:
        description: "에피소드 폴더 이름 (episodes/ 아래)"
        required: true
        default: ep01-artillery
      test_voice:
        description: "점검용: 일레븐랩스 키 없이 무료 목소리로 파이프라인만 시험 (업로드용 아님)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: shorts-${{ inputs.episode }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EP: ${{ inputs.episode }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID || 'U1cJYS4EdbaHmfR7YzHd' }}
      TTS_STRICT: ${{ inputs.test_voice && '0' || '1' }}   # 기본: 일레븐랩스(Minho)가 아니면 중단
      ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL }}
      TTS_SPEED: ${{ vars.TTS_SPEED }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 설치
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk > /dev/null
          pip install -q requests pillow edge-tts faster-whisper
          npm ci

      # 위성·지형 타일은 한 번 받으면 캐시에 보관 (렌더 중 인터넷 타일 사용 안 함)
      - name: 지도 타일 캐시
        uses: actions/cache@v4
        with:
          path: public/tiles
          key: tiles-v3-${{ hashFiles('pipeline/tiles.py') }}
      - name: 위성 타일 받기 + 모자이크 2장 만들기
        run: python pipeline/tiles.py

      # 같은 대본이면 TTS를 다시 사지 않도록 캐시
      - name: 나레이션 캐시 불러오기
        id: ttscache
        uses: actions/cache/restore@v4
        with:
          path: public/ep/${{ inputs.episode }}/tts
          key: tts-${{ inputs.episode }}-${{ hashFiles(format('episodes/{0}/episode.json', inputs.episode), 'pipeline/prepare.py') }}
          # 대본 외 설정만 바뀌어도 같은 문장은 크레딧 재사용 (파일 이름이 대본·목소리 값으로 구분됨)
          restore-keys: |
            tts-${{ inputs.episode }}-
      - name: 나레이션 + 자막 타임라인
        run: python pipeline/prepare.py "$EP"
      # 검증·렌더가 실패해도 산 TTS는 바로 저장 → 다시 실행할 때 크레딧 재사용
      - name: 나레이션 캐시 저장
        if: steps.ttscache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: public/ep/${{ inputs.episode }}/tts
          key: tts-${{ inputs.episode }}-${{ hashFiles(format('episodes/{0}/episode.json', inputs.episode), 'pipeline/prepare.py') }}

      - name: Whisper tiny 모델 캐시
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-tiny-v1

      # 렌더 전 검증: 끝 무음 2초 이상·영상/오디오 길이 차 2초 초과·자막 끝≠음성 끝이면 여기서 중단
      - name: 오디오 공백·자막 싱크 검증 (ffmpeg silencedetect + faster-whisper)
        run: python scripts/validate_audio_sync.py "$EP" --require-whisper

      - name: 렌더링 (기본 1080x1920 · QHD 에피소드는 1440x2560 · 30fps · 길이 = 나레이션 + 1.5초)
        run: |
          npx remotion browser ensure
          # episode.json의 "composition"(예: ep05-military-gap, QHD)이 있으면 그 컴포지션, 없으면 Short
          COMP=$(python -c "import json;print(json.load(open('episodes/$EP/episode.json')).get('composition','Short'))")
          echo "COMP=$COMP" >> "$GITHUB_ENV"
          START=$(date +%s)
          # 지도는 Canvas 2D(CPU) 렌더 → WebGL 불필요. --disable-dev-shm-usage는 Remotion이 기본으로 붙임
          npx remotion render src/index.ts "$COMP" "out/$EP.mp4" \
            --props="{\"ep\":\"$EP\"}" --gl=swiftshader --concurrency=2 \
            --codec=h264 --crf=18 --x264-preset=veryfast --audio-bitrate=192k \
            --timeout=120000 --log=info
          echo "RENDER_SEC=$(( $(date +%s) - START ))" >> "$GITHUB_ENV"
          # 쇼츠 권장 음량 (-14 LUFS), 영상은 그대로 복사
          ffmpeg -y -v error -i "out/$EP.mp4" -c:v copy -af loudnorm=I=-14:TP=-1.5:LRA=11 -c:a aac -b:a 192k out/final.mp4
          mv out/final.mp4 "out/$EP.mp4"
          cp "public/ep/$EP/$EP.srt" out/
          # episode.json "exports"로 지정한 오디오·자막 JSON도 같이 첨부
          python -c "import json,shutil,os;e=json.load(open('episodes/$EP/episode.json')).get('exports') or {};[shutil.copy(p,'out/') for p in e.values() if os.path.exists(p)]"
          # 유튜브 업로드용 메타데이터 (dist/epNN_metadata.txt)가 있으면 같이 첨부
          cp "dist/${EP%%-*}_metadata.txt" out/ 2>/dev/null || true
          echo "최종 음량:" && ffmpeg -hide_banner -nostats -i "out/$EP.mp4" -af ebur128=peak=true -f null - 2>&1 | tail -12
          echo "최종 프레임 수: $(ffprobe -v error -select_streams v:0 -count_packets -show_entries stream=nb_read_packets -of csv=p=0 "out/$EP.mp4")"
          # 렌더 후 검증: MP4 길이가 예정 길이와 같은지
          python scripts/validate_audio_sync.py "$EP" --video "out/$EP.mp4"
          # 확인용 장면 컷 3장
          for t in 3 15 30; do ffmpeg -y -v error -ss $t -i "out/$EP.mp4" -frames:v 1 -q:v 3 "out/${EP}_${t}s.jpg"; done

      - name: 결과 요약
        run: |
          D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "out/$EP.mp4")
          RES=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "out/$EP.mp4")
          ENGINE=$(python -c "import json;print(json.load(open('public/ep/$EP/timeline.json'))['engine'])")
          {
            echo "## ✅ $EP 렌더 완료"
            echo "- 길이: ${D}초 (나레이션 + 여운 1.5초) · 해상도 ${RES} · 30fps · 컴포지션 ${COMP}"
            echo "- 나레이션 엔진: $ENGINE"
            echo "- 렌더 시간: ${RENDER_SEC}초"
            echo "- 다운로드: 아래 Artifacts의 **$EP-shorts** (3일 뒤 자동 삭제)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 결과물 올리기 (Artifacts · 3일 보관)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.episode }}-shorts
          path: |
            out/${{ inputs.episode }}.mp4
            out/${{ inputs.episode }}.srt
            out/*.jpg
            out/validate_*.md
            out/*_metadata.txt
            out/shorts_*.mp3
            out/shorts_*.json
          retention-days: 3

      - name: 실패 시 점검 자료 올리기 (나레이션·타임라인·검증 결과)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.episode }}-debug
          path: |
            public/ep/${{ inputs.episode }}/
            out/validate_*.md
          retention-days: 3
